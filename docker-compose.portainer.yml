# Compose pensado para desplegar como Stack de Git en Portainer.
# A diferencia de docker-compose.yml (que usa env_file: .env.docker, ignorado por git),
# aquí los secretos llegan desde las VARIABLES DE ENTORNO DEL STACK en Portainer:
#   APP_KEY, APP_URL, APP_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD, DB_ROOT_PASSWORD

x-app-env: &app-env
  APP_NAME: ContratamosSAS
  APP_ENV: production
  APP_KEY: ${APP_KEY}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:8095}
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: es
  APP_FAKER_LOCALE: es_ES
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-contratamos}
  DB_USERNAME: ${DB_USERNAME:-contratamos}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  SESSION_DRIVER: database
  SESSION_LIFETIME: "120"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  MAIL_MAILER: log

services:
  # Aplicación Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: contratamos-app
    restart: unless-stopped
    environment: *app-env
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - contratamos

  # Servidor web Nginx
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: contratamos-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:80"
    depends_on:
      - app
    networks:
      - contratamos

  # Worker de colas (no migra: lo hace 'app')
  queue:
    image: contratamos-app
    restart: unless-stopped
    environment:
      <<: *app-env
      SKIP_INIT: "true"
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    depends_on:
      - app
      - db
    networks:
      - contratamos

  # Base de datos MariaDB
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-contratamos}
      MARIADB_USER: ${DB_USERNAME:-contratamos}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - contratamos

volumes:
  db-data:
  storage-data:

networks:
  contratamos:
    driver: bridge
