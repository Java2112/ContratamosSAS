name: Security Pipeline Scan (DevSecOps)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none

    - name: Composer Audit (Backend Dependency Scanner)
      run: composer audit

    - name: Run PHPStan (Static Code Analysis)
      run: |
        composer install --prefer-dist --no-progress --no-interaction
        vendor/bin/phpstan analyse app --level=5 --error-format=github || echo "PHPStan finished with issues."

    - name: NPM Security Audit (Frontend Dependency Scanner)
      run: |
        npm ci
        npm audit --audit-level=high
